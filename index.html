<body>
    <nav class="navbar navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <img src="{{ url_for('static', filename='uploads/Monte_Logos.png') }}"
                     alt="Logo"
                     width="75"
                     height="75"
                     class="d-inline-block align-text-top">
                CSUMB Creative Mode
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center mb-4">CSUMB Image Filter Editor</h1>

        <div class="row">
            <div class="col-md-3">
                <div class="filter-sidebar d-grid gap-2">
                    <h4 class="text-center">Filters</h4>

                    <button class="btn btn-outline-primary" disabled>Sepia</button>
                    <button class="btn btn-outline-primary" disabled>Negative</button>
                    <button class="btn btn-outline-primary" disabled>Chroma</button>
                    <button class="btn btn-outline-primary" disabled>Crop</button>
                    <button class="btn btn-outline-primary" disabled>Shrink</button>
                    <button class="btn btn-outline-primary" disabled>Grow</button>

                    {% if image_name %}
                    <form action="/" method="post">
                        <input type="hidden" name="action" value="mirror">
                        <input type="hidden" name="current_image" value="{{ image_name }}">
                        <button type="submit" class="btn btn-outline-primary w-100">Mirror</button>
                    </form>
                    {% else %}
                    <button class="btn btn-outline-primary" disabled>Mirror</button>
                    {% endif %}

                    <hr>

                    <button class="btn btn-outline-info" disabled>Pixel Shuffle</button>
                    <button class="btn btn-outline-info" disabled>Random Stack</button>

                    <hr>

                    <button class="btn btn-outline-success" disabled>Stack</button>
                    <button class="btn btn-success" disabled>Save</button>

                    <form action="/" method="post">
                        <input type="hidden" name="action" value="reset">
                        <button type="submit" class="btn btn-danger mt-2 w-100">Reset</button>
                    </form>
                </div>
            </div>

            <div class="col-md-9">
                <div class="card shadow">

                    <div class="card-header dark-blue-header">
                        Your Image
                    </div>

                    <div class="card-body text-center p-0">
                        <div class="image-display-area">
                            {% if image_name %}
                                <img src="{{ url_for('static', filename='uploads/' + image_name) }}"
                                     class="img-fluid"
                                     alt="User Image">
                            {% else %}
                                <p class="text-muted">
                                    No image uploaded yet. Use the input below.
                                </p>
                            {% endif %}
                        </div>
                    </div>

                    <div class="card-footer">
                        <form action="/" method="post" enctype="multipart/form-data">
                            <input type="hidden" name="action" value="upload">
                            <input type="file" class="form-control mb-2" name="image_file">
                            <button type="submit" class="btn btn-primary w-100">
                                Upload Image
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    {{ bootstrap.load_js() }}
</body>
</html>
